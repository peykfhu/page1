<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate Pricing Table - AnPin AI</title>
    <style>
        :root{--bg:#f8fafc;--text:#111827;--muted:#6b7280;--border:#e5e7eb;--accent:#8b5cf6;--card:#fff}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI","Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh;padding:24px 28px}
        @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

        .container{max-width:1440px;margin:0 auto}
        .page-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px;animation:fadeUp .5s cubic-bezier(.22,1,.36,1) both}
        .header-copy{min-width:0}
        .page-header h1{font-size:1.3rem;font-weight:800;letter-spacing:-.5px;margin-bottom:4px}
        .page-header p{font-size:.82rem;color:var(--muted)}
        .lang-toggle{display:inline-flex;align-items:center;gap:3px;padding:3px;border:1px solid var(--border);border-radius:8px;background:var(--card);box-shadow:0 3px 14px rgba(15,23,42,.04);flex-shrink:0}
        .lang-btn{border:0;background:transparent;color:var(--muted);font:inherit;font-size:.74rem;font-weight:800;line-height:1;padding:7px 10px;border-radius:6px;cursor:pointer;transition:all .18s ease}
        .lang-btn:hover{color:var(--text);background:#f9fafb}
        .lang-btn.active{background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(139,92,246,.24)}

        .group-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-bottom:28px;animation:fadeUp .5s cubic-bezier(.22,1,.36,1) .05s both}
        .group-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;transition:all .3s cubic-bezier(.22,1,.36,1)}
        .group-card:hover{box-shadow:0 6px 24px rgba(0,0,0,.06);transform:translateY(-2px)}
        .group-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
        .group-badge{font-size:1.5rem;font-weight:800;color:var(--accent)}
        .group-tag{font-size:.68rem;font-weight:700;padding:3px 10px;border-radius:6px;text-transform:uppercase;letter-spacing:.3px}
        .tag-gpt{background:#f0fdf4;color:#16a34a}
        .tag-claude{background:#fff7ed;color:#ea580c}
        .tag-all{background:#f5f3ff;color:#7c3aed}
        .group-name{font-size:.88rem;font-weight:700;margin-bottom:4px}
        .group-desc{font-size:.76rem;color:var(--muted);line-height:1.5;margin-bottom:10px}
        .group-formula{font-size:.72rem;color:var(--muted);background:#f9fafb;border:1px solid var(--border);border-radius:8px;padding:8px 10px;line-height:1.6}
        .group-formula strong{color:var(--text)}

        .section-title{font-size:1.05rem;font-weight:800;margin:28px 0 14px;display:flex;align-items:center;gap:8px;animation:fadeUp .5s cubic-bezier(.22,1,.36,1) .15s both}
        .section-title::before{content:'';width:4px;height:18px;border-radius:2px;background:var(--accent)}

        .table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border);background:var(--card);animation:fadeUp .5s cubic-bezier(.22,1,.36,1) .2s both}
        .price-table{width:100%;border-collapse:collapse}
        .price-table thead{position:sticky;top:0;z-index:2}
        .price-table th{background:#f9fafb;border:1px solid var(--border);padding:10px 12px;font-size:.72rem;font-weight:700;text-align:center;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
        .price-table th.col-model{text-align:left;min-width:180px}
        .price-table th.col-type{text-align:left;min-width:80px}
        .price-table td{border:1px solid var(--border);padding:8px 12px;font-size:.8rem;background:var(--card);text-align:center}
        .price-table td.td-left{text-align:left}
        .price-table tr:hover td{background:#faf5ff}
        .model-name{font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
        .provider-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
        .dot-anthropic{background:#ea580c}
        .dot-openai{background:#16a34a}
        .price-val{font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
        .price-unit{font-size:.66rem;color:var(--muted);font-weight:500}
        .tier-col{font-weight:700;font-size:.78rem}
        .t-low{color:#16a34a;background:#f0fdf4!important}
        .t-mid{color:#d97706;background:#fffbeb!important}
        .t-high{color:#dc2626;background:#fef2f2!important}
        .na-cell{color:#d1d5db;font-style:italic;font-size:.72rem}

        .note{font-size:.76rem;color:var(--muted);margin-top:20px;padding:12px 16px;background:#f9fafb;border-radius:10px;border:1px solid var(--border);line-height:1.7;animation:fadeUp .5s cubic-bezier(.22,1,.36,1) .25s both}
        .note strong{color:var(--text)}
        .note ul{margin:6px 0 0 16px}
        .note li{margin-bottom:3px}

        @media(max-width:768px){
            body{padding:16px 14px}
            .page-header{align-items:stretch;flex-direction:column}
            .lang-toggle{align-self:flex-start}
            .group-grid{grid-template-columns:1fr}
            .price-table th,.price-table td{padding:6px 8px;font-size:.72rem}
        }
    </style>
</head>
<body>
<div class="container">
    <div class="page-header">
        <div class="header-copy">
            <h1 data-i18n="pageTitle">倍率价格表</h1>
            <p data-i18n="pageDesc">价格基于官方模型价格计算。单位：$/百万 tokens，包含输入、输出、缓存写入和缓存读取。</p>
        </div>
        <div class="lang-toggle" aria-label="Language switch">
            <button class="lang-btn active" type="button" data-lang="zh">中文</button>
            <button class="lang-btn" type="button" data-lang="en">EN</button>
        </div>
    </div>

    <div class="group-grid" id="group-cards"></div>

    <div class="section-title" data-i18n="claudeTitle">Claude 模型价格对比（含缓存）</div>
    <div class="table-wrap">
        <table class="price-table" id="table-claude"></table>
    </div>

    <div class="section-title" data-i18n="gptTitle">GPT 模型价格对比（含缓存）</div>
    <div class="table-wrap">
        <table class="price-table" id="table-gpt"></table>
    </div>

    <div class="note" id="note-section"></div>
</div>

<script>
var claudeModels = [
    {name:"claude-fable-5", input:10.00, output:50.00, cache_write:12.50, cache_read:1.00},
    {name:"claude-mythos-5", input:10.00, output:50.00, cache_write:12.50, cache_read:1.00},
    {name:"claude-opus-4-8", input:5.00, output:25.00, cache_write:6.25, cache_read:0.50},
    {name:"claude-sonnet-4-6", input:3.00, output:15.00, cache_write:3.75, cache_read:0.30},
    {name:"claude-sonnet-4-5-20250929", input:3.00, output:15.00, cache_write:3.75, cache_read:0.30},
    {name:"claude-opus-4-7", input:5.00, output:25.00, cache_write:6.25, cache_read:0.50},
    {name:"claude-opus-4-6", input:5.00, output:25.00, cache_write:6.25, cache_read:0.50},
    {name:"claude-opus-4-5-20251101", input:5.00, output:25.00, cache_write:6.25, cache_read:0.50},
    {name:"claude-haiku-4-5-20251001", input:1.00, output:5.00, cache_write:1.25, cache_read:0.10},
];

var gptModels = [
    {name:"gpt-5.5", input:5.00, output:25.00, cache_write:0, cache_read:1.25},
    {name:"gpt-5.4", input:2.50, output:15.00, cache_write:0, cache_read:0.25},
    {name:"gpt-5.4-mini", input:0.75, output:4.50, cache_write:0, cache_read:0.075},
    {name:"gpt-5.2", input:1.75, output:14.00, cache_write:0, cache_read:0.175},
    {name:"gpt-5.2-codex", input:1.75, output:14.00, cache_write:0, cache_read:0.175},
    {name:"gpt-5.3-codex", input:1.75, output:14.00, cache_write:0, cache_read:0.175},
    {name:"gpt-image-2", input:0.10, output:0.10, cache_write:0, cache_read:2.00},
];

var lang = localStorage.getItem('pricingTableLang') || localStorage.getItem('anpin-lang') || 'zh';
if (!['zh', 'en'].includes(lang)) lang = 'zh';

var i18n = {
    zh: {
        title: "倍率价格表 - AnPin AI",
        pageTitle: "倍率价格表",
        pageDesc: "价格基于官方模型价格计算。单位：$/百万 tokens，包含输入、输出、缓存写入和缓存读取。",
        claudeTitle: "Claude 模型价格对比（含缓存）",
        gptTitle: "GPT 模型价格对比（含缓存）",
        model: "模型",
        type: "类型",
        officialPrice: "官方价格",
        input: "输入",
        output: "输出",
        cacheWrite: "缓存写入",
        cacheRead: "缓存读取",
        notesTitle: "倍率说明",
        noteRate: "倍率 = 实际成本 / 官方标准价格。例如，0.15x 表示官方价格的 15%。",
        noteGpt: "0.15x 适用于部分 GPT 模型。",
        noteClaude: "0.4x / 0.6x / 0.7x / 1.2x / 1.6x / 2x 为 Claude 接入通道。",
        noteCache: "缓存写入在写入缓存时计费；缓存读取在命中缓存时计费。",
        noteBilling: "实际计费以平台控制台展示价格为准。",
        groups: {
            gpt015: {name: "gpt5.5 和 gpt-image-2", desc: "部分 GPT 模型的低倍率通道"},
            claude04: {name: "Claude 反代通道", desc: "经济型 Claude 接入通道"},
            claude06: {name: "小池子", desc: "稳定 Claude 接入池"},
            claude07: {name: "Claude 低延迟通道", desc: "低延迟，高缓存命中率"},
            claude12: {name: "Claude 高级通道", desc: "高级 Claude 接入通道"},
            claude16: {name: "Claude 优先通道", desc: "优先级 Claude 接入通道"},
            claude20: {name: "Claude 专属 max 池", desc: "专属高容量 Claude 资源池"}
        }
    },
    en: {
        title: "Rate Pricing Table - AnPin AI",
        pageTitle: "Grouped Rate Pricing Table",
        pageDesc: "Rates are based on official model prices. Unit: $/M tokens for input, output, cache write, and cache read.",
        claudeTitle: "Claude model price comparison with cache",
        gptTitle: "GPT model price comparison with cache",
        model: "Model",
        type: "Type",
        officialPrice: "Official Price",
        input: "Input",
        output: "Output",
        cacheWrite: "Cache Write",
        cacheRead: "Cache Read",
        notesTitle: "Rate notes",
        noteRate: "Rate = actual cost / official standard price. For example, 0.15x means 15% of official price.",
        noteGpt: "0.15x is for selected GPT models.",
        noteClaude: "0.4x / 0.6x / 0.7x / 1.2x / 1.6x / 2x are Claude access channels.",
        noteCache: "Cache Write is charged when writing cache; Cache Read is charged on cache hits.",
        noteBilling: "Actual billing follows the price shown in the platform console.",
        groups: {
            gpt015: {name: "gpt5.5 and gpt-image-2", desc: "Low-rate channel for selected GPT models"},
            claude04: {name: "Claude reverse channel", desc: "Economy Claude access channel"},
            claude06: {name: "Small pool", desc: "Stable Claude access pool"},
            claude07: {name: "Low-latency Claude channel", desc: "Low latency with a high cache hit rate"},
            claude12: {name: "Premium Claude channel", desc: "Premium Claude access channel"},
            claude16: {name: "Priority Claude channel", desc: "Priority Claude access channel"},
            claude20: {name: "Dedicated Claude max pool", desc: "Dedicated high-capacity Claude resource pool"}
        }
    }
};

var groups = [
    {
        id: "gpt015",
        rate: 0.15,
        scope: "gpt",
        tag: "GPT",
        tagCss: "tag-gpt",
        css: "t-low"
    },
    {
        id: "claude04",
        rate: 0.4,
        scope: "claude",
        tag: "Claude",
        tagCss: "tag-claude",
        css: "t-low"
    },
    {
        id: "claude06",
        rate: 0.6,
        scope: "claude",
        tag: "Claude",
        tagCss: "tag-claude",
        css: "t-mid"
    },
    {
        id: "claude07",
        rate: 0.7,
        scope: "claude",
        tag: "Claude",
        tagCss: "tag-claude",
        css: "t-mid"
    },
    {
        id: "claude12",
        rate: 1.2,
        scope: "claude",
        tag: "Claude",
        tagCss: "tag-claude",
        css: "t-high"
    },
    {
        id: "claude16",
        rate: 1.6,
        scope: "claude",
        tag: "Claude",
        tagCss: "tag-claude",
        css: "t-high"
    },
    {
        id: "claude20",
        rate: 2.0,
        scope: "claude",
        tag: "Claude",
        tagCss: "tag-claude",
        css: "t-high"
    },
];

function priceStr(v) {
    if (v === 0) return '-';
    if (v < 0.01) return '$' + v.toFixed(4);
    if (v < 1) return '$' + v.toFixed(3);
    return '$' + v.toFixed(2);
}

function renderGroupCards() {
    var t = i18n[lang];
    var html = '';
    groups.forEach(function(g) {
        var copy = t.groups[g.id];
        html += '<div class="group-card">' +
            '<div class="group-header"><span class="group-badge">' + g.rate + 'x</span><span class="group-tag ' + g.tagCss + '">' + g.tag + '</span></div>' +
            '<div class="group-name">' + copy.name + '</div>' +
            '<div class="group-desc">' + copy.desc + '</div>' +
        '</div>';
    });
    document.getElementById('group-cards').innerHTML = html;
}

function renderTable(tableId, models, platform) {
    var t = i18n[lang];
    var applicableGroups = groups.filter(function(g) { return g.scope === platform || g.scope === 'all'; });

    var thead = '<thead><tr><th class="col-model">' + t.model + '</th><th>' + t.type + '</th><th>' + t.officialPrice + '</th>';
    applicableGroups.forEach(function(g) {
        thead += '<th>' + g.rate + 'x<br><span style="font-size:.62rem;font-weight:500;color:#9ca3af">' + t.groups[g.id].name + '</span></th>';
    });
    thead += '</tr></thead>';

    var tbody = '<tbody>';
    models.forEach(function(m) {
        var types = [
            {key:'input', label:t.input, val:m.input},
            {key:'output', label:t.output, val:m.output},
            {key:'cacheWrite', label:t.cacheWrite, val:m.cache_write},
            {key:'cacheRead', label:t.cacheRead, val:m.cache_read},
        ];
        var first = true;
        types.forEach(function(t) {
            if (t.val === 0 && t.key === 'cacheWrite') return;
            tbody += '<tr>';
            if (first) {
                var dotClass = platform === 'claude' ? 'dot-anthropic' : 'dot-openai';
                tbody += '<td class="td-left" rowspan="' + types.filter(function(x){return !(x.val===0 && x.key==='cacheWrite')}).length + '"><div class="model-name"><span class="provider-dot ' + dotClass + '"></span>' + m.name + '</div></td>';
                first = false;
            }
            tbody += '<td class="td-left" style="font-size:.74rem;color:var(--muted)">' + t.label + '</td>';
            tbody += '<td><span class="price-val">' + priceStr(t.val) + '</span> <span class="price-unit">/M</span></td>';
            applicableGroups.forEach(function(g) {
                var tierPrice = t.val * g.rate;
                var css = g.css;
                tbody += '<td class="tier-col ' + css + '"><span class="price-val">' + priceStr(tierPrice) + '</span></td>';
            });
            tbody += '</tr>';
        });
    });
    tbody += '</tbody>';

    document.getElementById(tableId).innerHTML = thead + tbody;
}

function renderNote() {
    var t = i18n[lang];
    document.getElementById('note-section').innerHTML =
        '<strong>' + t.notesTitle + '</strong>' +
        '<ul>' +
        '<li><strong>' + t.noteRate + '</strong></li>' +
        '<li><strong>' + t.noteGpt + '</strong></li>' +
        '<li><strong>' + t.noteClaude + '</strong></li>' +
        '<li>' + t.noteCache + '</li>' +
        '<li>' + t.noteBilling + '</li>' +
        '</ul>';
}

function applyLanguage(nextLang) {
    lang = nextLang;
    localStorage.setItem('pricingTableLang', lang);
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    document.title = i18n[lang].title;
    document.querySelectorAll('[data-i18n]').forEach(function(el) {
        el.textContent = i18n[lang][el.dataset.i18n];
    });
    document.querySelectorAll('.lang-btn').forEach(function(btn) {
        btn.classList.toggle('active', btn.dataset.lang === lang);
    });
    renderGroupCards();
    renderTable('table-claude', claudeModels, 'claude');
    renderTable('table-gpt', gptModels, 'gpt');
    renderNote();
}

document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.lang-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            applyLanguage(btn.dataset.lang);
        });
    });
    applyLanguage(lang);
});
</script>
</body>
</html>
